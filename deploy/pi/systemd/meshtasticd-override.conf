# batnet: always bring the radio daemon back.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
# The radio stick's USB is served by meshtasticd itself (libusb): when the Pi
# is busy, its transfers time out (B79). First in line for the CPU and the card.
Nice=-10
IOSchedulingClass=best-effort
IOSchedulingPriority=0
