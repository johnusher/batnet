# batnet: the journal on the card, so a reboot or a power cut keeps why it
# happened. Raspberry Pi OS keeps it in memory only: about 8 MB, a few hours
# of meshtasticd's chatter on a busy mesh. At most 400 MB, about a week and a
# half on a busy roof (64 MB held a day and a half), so the weekly stats see
# the whole week; never the card's last 1 GB. The size changes nothing in how
# much is written, only how long it is kept.
[Journal]
Storage=persistent
SystemMaxUse=400M
SystemKeepFree=1G
