<text x="50.0" y="444.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">20 s</text>
<text x="50.0" y="50.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">time ↓</text>
<line x1="237.3" y1="466.0" x2="237.3" y2="484.0" stroke="#1a7f37" stroke-width="1" stroke-dasharray="2 2"/>
<text x="237.3" y="498.0" font-size="12" fill="#1a7f37" text-anchor="middle" font-weight="bold">LoRaWAN sensors</text>
<text x="237.3" y="513.0" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">868.1 / .3 / .5</text>
<line x1="467.7" y1="466.0" x2="467.7" y2="484.0" stroke="#59636e" stroke-width="1" stroke-dasharray="2 2"/>
<text x="467.7" y="498.0" font-size="12" fill="#59636e" text-anchor="middle" font-weight="bold">smart meters</text>
<text x="467.7" y="513.0" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">(wireless M-Bus)</text>
<line x1="574.1" y1="466.0" x2="574.1" y2="484.0" stroke="#cf222e" stroke-width="1" stroke-dasharray="2 2"/>
<text x="574.1" y="498.0" font-size="12" fill="#cf222e" text-anchor="middle" font-weight="bold">alarm</text>
<line x1="671.6" y1="480.0" x2="671.6" y2="484.0" stroke="#d9480f" stroke-width="1" stroke-dasharray="2 2"/>
<text x="671.6" y="498.0" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="bold">Meshtastic + batnet</text>
<text x="671.6" y="513.0" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">869.4–869.65</text>
<line x1="719.9" y1="79.0" x2="719.9" y2="134.1" stroke="#1f2328" stroke-width="1"/>
<text x="725.9" y="90.4" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">one message,</text>
<text x="725.9" y="105.4" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">then two neighbours</text>
<text x="725.9" y="120.4" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">repeating it</text>
<text x="725.9" y="232.2" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">← a LoRaWAN gateway</text>
<text x="739.9" y="247.2" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">uses this slot too</text>
<text x="450.0" y="546.0" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal" font-style="italic">An illustration drawn from the band rules, not a recording. Brighter means a stronger (closer) radio.</text>
</svg>
