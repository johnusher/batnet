<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Illustrated waterfall of 867.8-870 MHz: LoRaWAN sensors, meters, an alarm and Meshtastic bursts sharing the band</title>
<rect width="100%" height="100%" rx="10" fill="#ffffff"/>
<text x="450.0" y="30.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">Sharing the band: 20 seconds of radio traffic around 868–870 MHz</text>
