<text x="224.0" y="271.0" font-size="11" fill="#e6edf3" text-anchor="start" font-weight="normal">hub</text>
<text x="215.0" y="430.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold">The usual guess: one range, all the way round</text>
<text x="215.0" y="448.0" font-size="12" fill="#9198a1" text-anchor="middle" font-weight="normal">15 km in every direction: about 717 km²</text>
