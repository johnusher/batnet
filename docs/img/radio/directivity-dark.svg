<text x="317.4" y="358.4" font-size="10" fill="#9198a1" text-anchor="start" font-weight="normal">15 km</text>
<line x1="215.0" y1="105.0" x2="215.0" y2="405.0" stroke="#3d444d" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="65.0" y1="255.0" x2="365.0" y2="255.0" stroke="#3d444d" stroke-width="1" stroke-dasharray="2 4"/>
