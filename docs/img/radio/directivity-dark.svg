<text x="664.0" y="286.0" font-size="11" fill="#e6edf3" text-anchor="start" font-weight="normal">hub</text>
<text x="546.8" y="153.7" font-size="11" fill="#e6edf3" text-anchor="end" font-weight="normal">heard 12 km away with</text>
<text x="546.8" y="167.7" font-size="11" fill="#e6edf3" text-anchor="end" font-weight="normal">3 dB to spare: could be 15 km</text>
<text x="635.4" y="300.4" font-size="11" fill="#9198a1" text-anchor="end" font-weight="normal">3 km away, yet heard</text>
<text x="635.4" y="314.4" font-size="11" fill="#9198a1" text-anchor="end" font-weight="normal">only through relays</text>
<text x="655.0" y="430.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold">What batnet works out from the signal</text>
<text x="655.0" y="448.0" font-size="12" fill="#9198a1" text-anchor="middle" font-weight="normal">15 km to the north-west, unknown elsewhere: about 45 km²</text>
<circle cx="190" cy="478" r="5" fill="#e6edf3"/>
<text x="200.0" y="482.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">heard straight, no relay</text>
<circle cx="375" cy="478" r="5" fill="#0d1117" stroke="#9198a1" stroke-width="2"/>
<text x="385.0" y="482.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">heard only through relays</text>
<rect x="566.0" y="471.0" width="16.0" height="12.0" rx="2" fill="#3d2414" fill-opacity="1" stroke="#ff8c42"/>
<text x="588.0" y="482.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">where it should hear a radio straight</text>
<text x="450.0" y="512.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="normal" font-style="italic">Readings of 23 October 2026 on Medium Fast, rounded to 10° and 1 km. The antenna is near the roof on one side of the house,</text>
<text x="450.0" y="527.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="normal" font-style="italic">so the house itself is probably in the way of the rest. A radio lower down or indoors is heard less far.</text>
