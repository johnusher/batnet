<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>A range circle of 15 km all round against the zone the hub works out: 15 km to the north-west only, from four radios heard with no relay</title>
<rect width="100%" height="100%" rx="10" fill="#0d1117"/>
<text x="450.0" y="30.0" font-size="18" fill="#e6edf3" text-anchor="middle" font-weight="bold">Which way does the hub hear? Not in a circle</text>
<text x="450.0" y="52.0" font-size="12" fill="#9198a1" text-anchor="middle" font-weight="normal">The first hub in Berlin. Every radio it hears with no relay shows how far it reaches in that direction.</text>
