<text x="679.5" y="266.0" font-size="12" fill="#ff8c42" text-anchor="middle" font-weight="normal">data: where each chirp starts is the data</text>
<text x="450.0" y="300.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="normal">Each chirp is a tone that slides up across the whole 250 kHz channel in 8.2 ms. On LongFast a chirp can start</text>
<text x="450.0" y="318.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="normal">at any of 2,048 places, so each one carries 11 bits. A receiver can pick these slides out even below the background hiss.</text>
