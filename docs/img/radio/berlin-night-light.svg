<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>One night of packets at the Berlin hub by number of relays: 28 direct, most through 2 to 4 relays, 49 through 7</title>
<rect width="100%" height="100%" rx="10" fill="#ffffff"/>
<text x="450.0" y="30.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">One night in Berlin: how many radios passed each message on before the hub heard it</text>
<line x1="110.0" y1="320.0" x2="840.0" y2="320.0" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="100.0" y="324.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">0</text>
<line x1="110.0" y1="270.0" x2="840.0" y2="270.0" stroke="#d1d9e0" stroke-width="1"/>
<text x="100.0" y="274.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">100</text>
<line x1="110.0" y1="220.0" x2="840.0" y2="220.0" stroke="#d1d9e0" stroke-width="1"/>
<text x="100.0" y="224.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">200</text>
<line x1="110.0" y1="170.0" x2="840.0" y2="170.0" stroke="#d1d9e0" stroke-width="1"/>
<text x="100.0" y="174.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">300</text>
<line x1="110.0" y1="120.0" x2="840.0" y2="120.0" stroke="#d1d9e0" stroke-width="1"/>
<text x="100.0" y="124.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">400</text>
<line x1="110.0" y1="70.0" x2="840.0" y2="70.0" stroke="#d1d9e0" stroke-width="1"/>
<text x="100.0" y="74.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">500</text>
<text x="100.0" y="56.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">packets</text>
<path d="M122.0,320.0 V310.0 Q122.0,306.0 126.0,306.0 H185.2 Q189.2,306.0 189.2,310.0 V320.0 Z" fill="#d9480f"/>
<text x="155.6" y="340.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">direct</text>
<text x="155.6" y="298.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">28</text>
<path d="M213.2,320.0 V194.5 Q213.2,190.5 217.2,190.5 H276.5 Q280.5,190.5 280.5,194.5 V320.0 Z" fill="#d9480f"/>
<text x="246.9" y="340.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">1</text>
<path d="M304.5,320.0 V110.0 Q304.5,106.0 308.5,106.0 H367.8 Q371.8,106.0 371.8,110.0 V320.0 Z" fill="#d9480f"/>
<text x="338.1" y="340.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">2</text>
<path d="M395.8,320.0 V94.0 Q395.8,90.0 399.8,90.0 H459.0 Q463.0,90.0 463.0,94.0 V320.0 Z" fill="#d9480f"/>
<text x="429.4" y="340.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">3</text>
<text x="429.4" y="82.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">460</text>
<path d="M487.0,320.0 V192.0 Q487.0,188.0 491.0,188.0 H550.2 Q554.2,188.0 554.2,192.0 V320.0 Z" fill="#d9480f"/>
<text x="520.6" y="340.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">4</text>
<path d="M578.2,320.0 V228.0 Q578.2,224.0 582.2,224.0 H641.5 Q645.5,224.0 645.5,228.0 V320.0 Z" fill="#d9480f"/>
<text x="611.9" y="340.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">5</text>
<path d="M669.5,320.0 V275.5 Q669.5,271.5 673.5,271.5 H732.8 Q736.8,271.5 736.8,275.5 V320.0 Z" fill="#d9480f"/>
<text x="703.1" y="340.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">6</text>
<path d="M760.8,320.0 V299.5 Q760.8,295.5 764.8,295.5 H824.0 Q828.0,295.5 828.0,299.5 V320.0 Z" fill="#d9480f"/>
<text x="794.4" y="340.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">7</text>
<text x="794.4" y="287.5" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">49</text>
<text x="475.0" y="362.0" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal">radios it came through on the way</text>
<text x="450.0" y="386.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">1,788 packets read from 154 radios between 22:30 and 07:15, on Medium Fast. Only 28 came straight from the sender.</text>
</svg>
