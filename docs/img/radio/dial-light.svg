<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>batnet's radio at 869.5 MHz compared with FM radio, walkie-talkies, mobile phones and WiFi</title>
<rect width="100%" height="100%" rx="10" fill="#ffffff"/>
<text x="450.0" y="30.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">Where batnet's long-range radio sits on the dial</text>
<line x1="40.0" y1="170.0" x2="860.0" y2="170.0" stroke="#59636e" stroke-width="1.5"/>
<line x1="128.0" y1="165.0" x2="128.0" y2="175.0" stroke="#59636e" stroke-width="1"/>
<text x="128.0" y="190.0" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">100 MHz</text>
<line x1="317.3" y1="165.0" x2="317.3" y2="175.0" stroke="#59636e" stroke-width="1"/>
<text x="317.3" y="190.0" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">300 MHz</text>
<line x1="524.7" y1="165.0" x2="524.7" y2="175.0" stroke="#59636e" stroke-width="1"/>
<text x="524.7" y="190.0" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">1 GHz</text>
<line x1="714.0" y1="165.0" x2="714.0" y2="175.0" stroke="#59636e" stroke-width="1"/>
<text x="714.0" y="190.0" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">3 GHz</text>
<rect x="105.0" y="161" width="36.3" height="18" fill="#8250df" fill-opacity="0.75"/>
<line x1="123.1" y1="161.0" x2="123.1" y2="152.0" stroke="#8250df" stroke-width="1" stroke-dasharray="2 2"/>
<text x="123.1" y="148.0" font-size="12" fill="#8250df" text-anchor="middle" font-weight="normal">FM radio</text>
<rect x="380.5" y="161" width="3.0" height="18" fill="#1a7f37" fill-opacity="0.75"/>
<line x1="380.9" y1="161.0" x2="380.9" y2="122.0" stroke="#1a7f37" stroke-width="1" stroke-dasharray="2 2"/>
<text x="380.9" y="118.0" font-size="12" fill="#1a7f37" text-anchor="middle" font-weight="normal">433 MHz gadgets:</text>
<rect x="385.6" y="161" width="3.0" height="18" fill="#1a7f37" fill-opacity="0.75"/>
<line x1="385.7" y1="179.0" x2="385.7" y2="224.0" stroke="#1a7f37" stroke-width="1" stroke-dasharray="2 2"/>
<text x="385.7" y="238.0" font-size="12" fill="#1a7f37" text-anchor="middle" font-weight="normal">walkie-talkies (PMR446)</text>
<rect x="484.3" y="161" width="14.8" height="18" fill="#8250df" fill-opacity="0.75"/>
<line x1="491.7" y1="179.0" x2="491.7" y2="224.0" stroke="#8250df" stroke-width="1" stroke-dasharray="2 2"/>
<text x="491.7" y="238.0" font-size="12" fill="#8250df" text-anchor="middle" font-weight="normal">4G mobile</text>
<rect x="502.7" y="161" width="15.0" height="18" fill="#8250df" fill-opacity="0.75"/>
<line x1="510.2" y1="179.0" x2="510.2" y2="250.0" stroke="#8250df" stroke-width="1" stroke-dasharray="2 2"/>
<text x="510.2" y="264.0" font-size="12" fill="#8250df" text-anchor="middle" font-weight="normal">2G / 4G mobile</text>
<rect x="617.2" y="161" width="16.3" height="18" fill="#8250df" fill-opacity="0.75"/>
<line x1="625.3" y1="179.0" x2="625.3" y2="224.0" stroke="#8250df" stroke-width="1" stroke-dasharray="2 2"/>
<text x="625.3" y="238.0" font-size="12" fill="#8250df" text-anchor="middle" font-weight="normal">mobile</text>
<rect x="675.6" y="161" width="5.9" height="18" fill="#0969da" fill-opacity="0.75"/>
<line x1="678.5" y1="161.0" x2="678.5" y2="152.0" stroke="#0969da" stroke-width="1" stroke-dasharray="2 2"/>
<text x="678.5" y="148.0" font-size="12" fill="#0969da" text-anchor="middle" font-weight="normal">WiFi, Bluetooth,</text>
<rect x="807.1" y="161" width="22.7" height="18" fill="#0969da" fill-opacity="0.75"/>
<line x1="818.5" y1="161.0" x2="818.5" y2="122.0" stroke="#0969da" stroke-width="1" stroke-dasharray="2 2"/>
<text x="818.5" y="118.0" font-size="12" fill="#0969da" text-anchor="middle" font-weight="normal">WiFi 5 GHz</text>
<text x="380.9" y="132.0" font-size="11" fill="#1a7f37" text-anchor="middle" font-weight="normal">car keys, weather stations</text>
<text x="678.4" y="162.0" font-size="11" fill="#0969da" text-anchor="middle" font-weight="normal">microwave ovens</text>
<rect x="498.1" y="140" width="5" height="60" fill="#d9480f"/>
<line x1="500.6" y1="140.0" x2="500.6" y2="62.0" stroke="#d9480f" stroke-width="1.5"/>
<text x="500.6" y="56.0" font-size="14" fill="#d9480f" text-anchor="middle" font-weight="bold">batnet + Meshtastic: 869.4–869.65 MHz</text>
<text x="40.0" y="264.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">Wavelength (the size of one radio wave):</text>
<line x1="128.0" y1="274.0" x2="128.0" y2="282.0" stroke="#1f2328" stroke-width="2"/>
<text x="128.0" y="298.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">3.0 m</text>
<line x1="380.9" y1="274.0" x2="380.9" y2="282.0" stroke="#1f2328" stroke-width="2"/>
<text x="380.9" y="298.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">69.1 cm</text>
<line x1="500.6" y1="274.0" x2="500.6" y2="282.0" stroke="#d9480f" stroke-width="2"/>
<text x="500.6" y="298.0" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="bold">34.5 cm</text>
<line x1="678.4" y1="274.0" x2="678.4" y2="282.0" stroke="#1f2328" stroke-width="2"/>
<text x="678.4" y="298.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">12.3 cm</text>
<line x1="818.4" y1="274.0" x2="818.4" y2="282.0" stroke="#1f2328" stroke-width="2"/>
<text x="818.4" y="298.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">5.5 cm</text>
<line x1="40.0" y1="278.0" x2="860.0" y2="278.0" stroke="#d1d9e0" stroke-width="1"/>
<text x="450.0" y="318.0" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal" font-style="italic">Lower frequency means longer waves, which reach further and get through walls and trees better.</text>
</svg>
