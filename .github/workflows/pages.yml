# Publishes the village simulator to GitHub Pages: https://johnusher.github.io/batnet/
# Only prototypes/village-sim is published, not the rest of the repo.
name: Simulator on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["prototypes/village-sim/**", "internal/**", "cmd/batnetwasm/**", "scenarios/**", "go.mod", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the site
        run: sh prototypes/village-sim/build-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
