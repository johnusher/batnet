name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Village scenarios (the real code, simulated)
        run: go run ./cmd/batnetd -sim scenarios/*.json
      - name: Cross-build without cgo (Pi Zero W to Pi 5)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build ./...
      - name: Knowledge bundle
        run: cd tools/okflint && go run . ../../knowledge
